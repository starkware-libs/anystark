name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# One publish at a time; a running publish is never cancelled (cancelling mid-publish can
# leave core published without react).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # A job of its own, so the SBOM tooling never holds the OIDC permission.
  sbom:
    name: SBOM of the AnyStark packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      # One CycloneDX SBOM of the four packages' runtime dependencies. `npm ls` flags ws@7's
      # optional utf-8-validate peer (^5) against the hoisted 6.0.6, hence --ignore-npm-errors.
      - run: >-
          node_modules/.bin/cyclonedx-npm --omit dev --ignore-npm-errors --output-reproducible
          -w @starkware-libs/anystark-core -w @starkware-libs/anystark-cctp
          -w @starkware-libs/anystark-react -w @starkware-libs/anystark-paymaster-proxy
          --output-file "anystark-$GITHUB_REF_NAME.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.ref_name }}
          path: anystark-${{ github.ref_name }}.cdx.json
          if-no-files-found: error

  publish:
    name: build, verify, publish the AnyStark packages
    # Every published release has an SBOM.
    needs: sbom
    runs-on: ubuntu-latest
    # The job waits until a required reviewer of the publish environment approves the run.
    environment: publish
    # contents: read to check out and verify main ancestry; id-token: write lets npm
    # authenticate through trusted publishing (OIDC).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the tagged commit can be checked for main ancestry below.
          fetch-depth: 0
      # Only a commit that reached main is releasable. A tag pushed on a stray commit
      # stops here, before anything touches the registry.
      - run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted publishing needs Node 22.14.0 or later and npm 11.5.1 or later; Node 24
          # ships both. No dependency cache, so the release build never restores a cache
          # that another workflow wrote.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tag is the source of truth: every publishable package must sit at the tag's
      # version, and every package that depends on core must pin it at ^<version>.
      - run: node scripts/assert_publish_versions.mjs "$GITHUB_REF_NAME"
      # Hoist each package's publishConfig entry points (main/types/exports) into the
      # manifest; npm honors publishConfig only for config values (registry and similar),
      # never entry points.
      - run: node scripts/prepare_publish.mjs
      # Publish core, then cctp, then react, then paymaster-proxy to npm. There is no npm
      # token: npm authenticates through each package's trusted publisher (OIDC). A
      # package's first version is published by hand (docs/releasing.md). A version already
      # on the registry is skipped, so a rerun after a partial failure is idempotent.
      - run: node scripts/publish_packages.mjs

  # Keeps the SBOM past the artifact's 90 days: attaches it to the tag's GitHub Release and
  # signs an SBOM attestation of the tarballs npm serves for this version.
  release:
    name: attach the SBOM to the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    # contents: write creates the Release; id-token: write and attestations: write sign and
    # store the attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ github.ref_name }}
      # Downloads the published tarballs, the attestation's subjects. It runs outside the
      # checkout so the repository's .npmrc min-release-age does not reject the new version.
      # npm takes a few minutes to serve a new version, so it tries once a minute, up to 20 times.
      - run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { PACKAGES } from "./scripts/publishable.mjs";
            for (const dir of PACKAGES) {
              const { name, version } = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
              console.log(`${name}@${version}`);
            }
          ' > "$RUNNER_TEMP/specs"
          mkdir "$RUNNER_TEMP/tarballs"
          cd "$RUNNER_TEMP/tarballs"
          for _ in $(seq 20); do
            sleep 60
            : > "$RUNNER_TEMP/missing"
            while read -r spec; do
              npm pack --prefer-online "$spec" || echo "$spec" >> "$RUNNER_TEMP/missing"
            done < "$RUNNER_TEMP/specs"
            mv "$RUNNER_TEMP/missing" "$RUNNER_TEMP/specs"
            if [ ! -s "$RUNNER_TEMP/specs" ]; then break; fi
          done
          test ! -s "$RUNNER_TEMP/specs"
      # The action recognizes CycloneDX only by a serialNumber, which the reproducible SBOM
      # omits, so the predicate type is given explicitly.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/tarballs/*.tgz
          predicate-type: https://cyclonedx.org/bom
          predicate-path: anystark-${{ github.ref_name }}.cdx.json
      # Creates the tag's Release with the SBOM, or replaces the SBOM on a rerun.
      - env:
          GH_TOKEN: ${{ github.token }}
          SBOM: anystark-${{ github.ref_name }}.cdx.json
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$SBOM" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$SBOM" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
