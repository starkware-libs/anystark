name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# One publish at a time; a running publish is never cancelled (cancelling mid-publish can
# leave core published without react).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # A job of its own, so the SBOM tooling never holds the OIDC permission.
  sbom:
    name: SBOM of the AnyStark packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      # One CycloneDX SBOM of the four packages' runtime dependencies. `npm ls` flags ws@7's
      # optional utf-8-validate peer (^5) against the hoisted 6.0.6, hence --ignore-npm-errors.
      - run: >-
          node_modules/.bin/cyclonedx-npm --omit dev --ignore-npm-errors --output-reproducible
          -w @starkware-libs/anystark-core -w @starkware-libs/anystark-cctp
          -w @starkware-libs/anystark-react -w @starkware-libs/anystark-paymaster-proxy
          --output-file "anystark-$GITHUB_REF_NAME.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.ref_name }}
          path: anystark-${{ github.ref_name }}.cdx.json
          if-no-files-found: error

  publish:
    name: build, verify, publish the AnyStark packages
    # Every published release has an SBOM.
    needs: sbom
    runs-on: ubuntu-latest
    # The job waits until a required reviewer of the publish environment approves the run.
    environment: publish
    # contents: read to check out and verify main ancestry; id-token: write lets npm
    # authenticate through trusted publishing (OIDC).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the tagged commit can be checked for main ancestry below.
          fetch-depth: 0
      # Only a commit that reached main is releasable. A tag pushed on a stray commit
      # stops here, before anything touches the registry.
      - run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted publishing needs Node 22.14.0 or later and npm 11.5.1 or later; Node 24
          # ships both. No dependency cache, so the release build never restores a cache
          # that another workflow wrote.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tag is the source of truth: every publishable package must sit at the tag's
      # version, and every package that depends on core must pin it at ^<version>.
      - run: node scripts/assert_publish_versions.mjs "$GITHUB_REF_NAME"
      # Hoist each package's publishConfig entry points (main/types/exports) into the
      # manifest; npm honors publishConfig only for config values (registry and similar),
      # never entry points.
      - run: node scripts/prepare_publish.mjs
      # Publish core, then cctp, then react, then paymaster-proxy to npm. There is no npm
      # token: npm authenticates through each package's trusted publisher (OIDC). A
      # package's first version is published by hand (docs/releasing.md). A version already
      # on the registry is skipped, so a rerun after a partial failure is idempotent.
      - run: node scripts/publish_packages.mjs
